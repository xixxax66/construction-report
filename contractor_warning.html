<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หนังสือแจ้งเตือนเร่งรัดเข้าทำงาน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    @font-face {
      font-family: 'THSarabunPSK';
      src: url('../assets/THSarabun.ttf') format('truetype'),
           url('assets/THSarabun.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'THSarabunPSK';
      src: url('../assets/THSarabun Bold.ttf') format('truetype'),
           url('assets/THSarabun Bold.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    body {
      font-family: 'THSarabunPSK', 'Sarabun', sans-serif;
      background-color: #94a3b8;
      margin: 0;
      padding: 0;
      font-size: 16pt;
      color: #000;
      -webkit-font-smoothing: antialiased;
    }

    .sheet-doc {
      width: 210mm;
      min-height: 297mm;
      padding: 25mm 20mm 20mm 30mm;
      margin: 15px auto;
      background: white;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 16pt;
      line-height: 1.15;
    }

    .header-section {
      position: relative;
      width: 100%;
      height: 3.5cm;
      margin-bottom: 3mm;
    }

    .garuda-box {
      position: absolute;
      top: -0.5cm;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .garuda-img {
      width: 3cm;
      height: auto;
    }

    .header-left {
      position: absolute;
      top: 1.5cm;
      left: 0;
      bottom: 0;
      line-height: 1.15;
    }

    .header-right {
      position: absolute;
      left: 70%;
      bottom: 0;
      line-height: 1.15;
      width: 50%;
    }

    .date-center {
      position: relative;
      width: 100%;
      text-align: left;
      left: 55%;
      margin-bottom: 4mm;
      line-height: 1.15;
    }

    .meta-section {
      margin-bottom: 4mm;
      line-height: 1.25;
    }
    .meta-row {
      display: flex;
      align-items: flex-start;
      margin-bottom: 3pt;
    }
    .meta-label {
      width: 1.25cm;
      flex-shrink: 0;
    }
    .meta-content {
      flex: 1;
    }

    .body-section {
      text-align: justify;
      line-height: 1.15;
    }
    .body-section .paragraph-box {
      margin-top: 0;
      margin-bottom: 6pt;
      text-indent: 2.5cm;
      width: 100%;
    }

    .body-section .auto-expand-area {
      text-indent: 2.5cm;
    }

    .closing-sign-area {
      width: 50%;
      margin-left: 35%;
      text-align: center;
      line-height: 1.15;
    }

    .footer-section {
      line-height: 1.15;
      margin-top: auto;
      padding-top: 15mm;
    }

    .editable-input {
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      padding: 0;
      line-height: inherit;
    }
    .editable-input:focus {
      background-color: #fef08a;
    }

    .auto-expand-area {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      padding: 0;
      line-height: inherit;
      resize: none;
      overflow: hidden;
      display: block;
      box-sizing: border-box;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .auto-expand-area:focus {
      background-color: #fef08a;
    }

    @media print {
      body {
        background: white !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print {
        display: none !important;
      }
      .sheet-doc {
        box-shadow: none !important;
        margin: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
        padding: 25mm 20mm 20mm 30mm !important;
        page-break-after: avoid;
        page-break-inside: avoid;
      }
      .editable-input, .auto-expand-area {
        background: transparent !important;
      }
    }
  </style>
</head>
<body class="p-2 sm:p-6 min-h-screen flex flex-col items-center">

  <!-- แถบควบคุมด้านบน -->
  <div class="max-w-[210mm] w-full mb-3 flex flex-wrap items-center justify-between gap-3 bg-white p-3.5 rounded-xl shadow border border-slate-300 no-print">
    <div class="flex items-center gap-2">
      <a href="index.html" class="p-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-700 flex items-center gap-1 text-sm font-bold">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> กลับหน้าหลัก
      </a>
      <span class="font-bold text-slate-800 text-lg">หนังสือแจ้งเตือนเร่งรัดเข้าทำงาน</span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="loadContractData()" class="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-1.5 rounded-lg text-sm font-bold shadow cursor-pointer">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i> ดึงข้อมูลสัญญา
      </button>
      <button onclick="window.print()" class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded-lg text-sm font-bold shadow cursor-pointer">
        <i data-lucide="printer" class="w-4 h-4"></i> พิมพ์ / PDF
      </button>
    </div>
  </div>

  <!-- แผ่นเอกสาร A4 -->
  <div class="sheet-doc" id="doc-print">
    <div>
      
      <!-- 1. ส่วนหัว -->
      <div class="header-section">
        <div class="garuda-box">
          <img src="../assets/Krut.png" alt="ตราครุฑ" class="garuda-img" onerror="this.src='assets/Krut.png';">
        </div>
        
        <div class="header-left">
          ที่ <input type="text" id="doc_no" class="editable-input w-[3.5cm]" value="มค ๗๗๔๐๑/" oninput="autoThaiNum(this)">
        </div>
        
        <div class="header-right">
          <p><input type="text" id="txt_org_issuer" class="editable-input w-full" value="องค์การบริหารส่วนตำบลโพนงาม" oninput="autoThaiNum(this)"></p>
          <p><input type="text" id="txt_org_address_1" class="editable-input w-full" value="หมู่ที่ ๑๒ ตำบลโพนงาม อำเภอโกสุมพิสัย" oninput="autoThaiNum(this)"></p>
          <p><input type="text" id="txt_org_address_2" class="editable-input w-full" value="จังหวัดมหาสารคาม ๔๔๑๔๐" oninput="autoThaiNum(this)"></p>
        </div>
      </div>

      <!-- 2. วันที่ -->
      <div class="date-center">
        <input type="text" id="doc_date" class="editable-input w-[6cm]" value="มิถุนายน ๒๕๖๙" oninput="autoThaiNum(this)">
      </div>

      <!-- 3. เรื่อง / เรียน / อ้างถึง -->
      <div class="meta-section">
        <div class="meta-row">
          <span class="meta-label">เรื่อง</span>
          <span class="meta-content">
            <textarea id="txt_subject" class="auto-expand-area" rows="1" oninput="autoExpand(this); autoThaiNum(this);">ขอให้เร่งรัดการดำเนินงานก่อสร้าง โครงการก่อสร้างถนนคอนกรีตเสริมเหล็ก สายจากสามแยกถนนลาดยางสวนนางสมดี การเพิ่ม ไปดอนแรด หมู่ที่ ๑๑ (สัญญาเลขที่ E๒/๒๕๖๙)</textarea>
          </span>
        </div>
        <div class="meta-row">
          <span class="meta-label">เรียน</span>
          <span class="meta-content"><input type="text" class="editable-input w-full" id="txt_contractor_recipient" value="ห้างหุ้นส่วนจำกัด โพธิ์ชัยแอสโซซิเอส" oninput="autoThaiNum(this)"></span>
        </div>
        <div class="meta-row">
          <span class="meta-label">อ้างถึง</span>
          <span class="meta-content"><input type="text" class="editable-input w-full" id="txt_contract_ref" value="สัญญาจ้างเลขที่ E๒/๒๕๖๙ ลงวันที่ ๑๐ ตุลาคม ๒๕๖๙" oninput="autoThaiNum(this)"></span>
        </div>
      </div>

      <!-- 4. เนื้อความหนังสือ (จัดรูปแบบย่อหน้าตามรูปแบบ Word) -->
      <div class="body-section">
          <div class="paragraph-box">
          <textarea id="txt_body_1" class="auto-expand-area" rows="1" oninput="autoExpand(this); autoThaiNum(this);">ตามที่ ท่านได้ทำสัญญาจ้างกับ องค์การบริหารส่วนตำบลโพนงาม เพื่อดำเนินก่อสร้างถนนคอนกรีตเสริมเหล็ก สายจากสามแยกถนนลาดยางสวนนางสมดี การเพิ่ม ไปดอนแรด หมู่ที่ ๑๑ กว้าง ๒.๖๐ เมตร ยาว ๑,๑๐๐.๐๐ เมตร หนา ๐.๑๕ เมตร ไหล่ทางลูกรัง ข้างละ ๐.๒๐ เมตร หรือพื้นที่ผิวจราจรไม่น้อยกว่า ๒,๘๖๐.๐๐ ตารางเมตร ด้วยวิธีประกวดราคาอิเล็กทรอนิกส์ ตามสัญญาที่อ้างถึง นั้น</textarea>
        </div>

        <div class="paragraph-box">
          <textarea id="txt_body_2" class="auto-expand-area" rows="1" oninput="autoExpand(this); autoThaiNum(this);">เนื่องจากการลงพื้นที่ตรวจสอบการดำเนินงานที่ผ่านมา ปรากฏว่าการปฏิบัติงานของท่านมีความล่าช้ากว่าแผนงานที่กำหนดไว้ในสัญญา เพื่อให้การดำเนินโครงการดังกล่าวเป็นไปด้วยความเรียบร้อยและแล้วเสร็จตามกำหนดเวลา องค์การบริหารส่วนตำบลโพนงามจึงขอให้ท่านเร่งรัดการดำเนินงาน โดยการระดมเครื่องจักร วัสดุอุปกรณ์ และคนงานเข้าปฏิบัติงานในพื้นที่ก่อสร้างให้เต็มกำลังความสามารถ หากพ้นกำหนดแล้วยังไม่มีความคืบหน้า องค์การบริหารส่วนตำบลโพนงามจะดำเนินการตามเงื่อนไขแห่งสัญญาและระเบียบของทางราชการต่อไป</textarea>
        </div>

        <div class="paragraph-box">
          <textarea class="auto-expand-area" rows="1" oninput="autoExpand(this); autoThaiNum(this);">จึงเรียนมาเพื่อโปรดพิจารณา</textarea>
        </div>
      </div>

      <!-- 5. คำลงท้ายและส่วนลงนาม -->
      <div class="closing-sign-area">
        <p>ขอแสดงความนับถือ</p>
        <div class="pt-12">
          <p><input type="text" class="editable-input text-center w-full" value="(นายชาญยุทธ ตวงพลจันทร์)" oninput="autoThaiNum(this)"></p>
          <p><input type="text" class="editable-input text-center w-full" value="นายกองค์การบริหารส่วนตำบลโพนงาม" oninput="autoThaiNum(this)"></p>
        </div>
      </div>
    </div>

    <!-- 6. ส่วนท้ายหนังสือ -->
    <div class="footer-section">
      <p>องค์การบริหารส่วนตำบลโพนงาม</p>
      <p>สำนักปลัด</p>
      <p>โทรศัพท์/โทรสาร ๐-๔๓๙๙-๖๐๗๗</p>
    </div>
  </div>

  <script>
    lucide.createIcons();

    let currentProjectID = 'DEFAULT_PROJ';

    function initProjectContext() {
      const basicRaw = localStorage.getItem('LOCAL_BASIC_INFO');
      if (basicRaw) {
        try {
          const projectData = JSON.parse(basicRaw);
          const cNo = projectData.contractNo || 'E2/2569';
          currentProjectID = `PROJ_${cNo.replace(/[^a-zA-Z0-9]/g, '_')}`;
        } catch(e) {}
      }
    }

    function toThaiNumber(numStr) {
      if (numStr === null || numStr === undefined) return '';
      const thaiNums = ['๐', '๑', '๒', '๓', '๔', '๕', '๖', '๗', '๘', '๙'];
      return numStr.toString().replace(/[0-9]/g, (w) => thaiNums[w]);
    }

    function autoThaiNum(el) {
      el.value = toThaiNumber(el.value);
    }

    function autoExpand(ta) {
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    }

    function loadContractData() {
      initProjectContext();
      const basicRaw = localStorage.getItem(`LOCAL_BASIC_INFO_${currentProjectID}`) || localStorage.getItem('LOCAL_BASIC_INFO');
      if (!basicRaw) return;

      try {
        const data = JSON.parse(basicRaw);

        if (data.contractorName) {
          document.getElementById('txt_contractor_recipient').value = toThaiNumber(data.contractorName);
        }

        let cNoStr = data.contractNo ? toThaiNumber(data.contractNo) : '—';
        let cDateStr = data.contractDate ? toThaiNumber(data.contractDate) : '—';

        if (data.contractNo && data.contractDate) {
          document.getElementById('txt_contract_ref').value = toThaiNumber(`สัญญาจ้างเลขที่ ${cNoStr} ลงวันที่ ${cDateStr}`);
        }

        if (data.projectName) {
          document.getElementById('txt_subject').value = toThaiNumber(`ขอให้เร่งรัดการดำเนินงานก่อสร้าง ${data.projectName} (สัญญาเลขที่ ${cNoStr})`);
        }

        let orgName = data.organizationName ? toThaiNumber(data.organizationName) : 'องค์การบริหารส่วนตำบลโพนงาม';
        if (data.projectName && data.projectScope) {
          document.getElementById('txt_body_1').value = toThaiNumber(`ตามที่ ท่านได้ทำสัญญาจ้างกับ ${orgName} เพื่อดำเนินงาน ${data.projectName} (${data.projectScope}) ตามสัญญาที่อ้างถึง นั้น`);
        }

      } catch(e) {
        console.error("Error loading contract data:", e);
      }
      
      document.querySelectorAll('textarea.auto-expand-area').forEach(ta => autoExpand(ta));
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadContractData();
      
      document.querySelectorAll('textarea.auto-expand-area').forEach(ta => {
        autoExpand(ta);
      });
    });
  </script>
</body>
</html>
