<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ภาพถ่ายสภาพการปฏิบัติงาน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../assets/gas-sync.js"></script>
  <style>
    @font-face { font-family: 'THSarabunPSK'; src: url('../assets/THSarabun.ttf') format('truetype'); font-weight: normal; }
    @font-face { font-family: 'THSarabunPSK'; src: url('../assets/THSarabun Bold.ttf') format('truetype'); font-weight: bold; }
    @page { size: A4 portrait; margin: 0; }
    body { font-family: 'THSarabunPSK', sans-serif; background-color: #94a3b8; margin: 0; padding: 0; }
    
    .sheet-doc { 
      width: 210mm; 
      min-height: 297mm; 
      padding: 12mm 18mm 12mm 22mm; 
      margin: 20px auto; 
      background: white; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
      font-size: 16pt !important; 
      line-height: 1.15 !important; 
      color: #000; 
      box-sizing: border-box; 
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .sheet-doc p, .sheet-doc span, .sheet-doc div { font-size: 16pt; line-height: 1.2; }
    .doc-title { font-size: 20pt !important; font-weight: bold; }
    
    .photo-box {
      width: 100%;
      aspect-ratio: 4 / 3;
      border: 1.5px solid #000;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
    }

    #cropper_container {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #0f172a;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      cursor: grab;
      touch-action: none;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    #cropper_container:active { cursor: grabbing; }
    #cropper_image {
      position: absolute;
      transform-origin: center center;
      user-select: none;
      max-width: none;
    }
    
    .cell-input-text { width: 100%; border: none; border-bottom: 1px dotted #64748b; outline: none; background: transparent; font-size: 15pt; text-align: center; }
    
    @media print {
      body { background: white !important; padding: 0 !important; }
      .no-print { display: none !important; }
      .sheet-doc { 
        box-shadow: none !important; 
        margin: 0 auto !important; 
        width: 210mm !important; 
        height: 297mm !important; 
        padding: 12mm 18mm 12mm 22mm !important; 
        page-break-after: always;
      }
      .sheet-doc:last-child { page-break-after: auto; }
      .empty-desc { display: none !important; }
      .cell-input-text { border-bottom: none !important; }
    }
  </style>
</head>
<body class="p-2 sm:p-6 min-h-screen flex justify-center">
  <input type="file" id="global_batch_upload_input" accept="image/*" multiple class="hidden" onchange="handleBatchUploadToDrive(event)">

  <!-- Modal เลือกรูปจากคลังใน Drive -->
  <div id="drive_picker_modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center hidden no-print">
    <div class="bg-white rounded-2xl p-5 max-w-2xl w-full mx-4 shadow-2xl border border-slate-200 space-y-4">
      <div class="flex items-center justify-between border-b pb-2">
        <h3 class="font-bold text-base text-slate-800 flex items-center gap-2">
          <i data-lucide="folder-kanban" class="w-5 h-5 text-blue-600"></i> เลือกรูปจากคลังใน Google Drive มาจัดวาง
        </h3>
        <button onclick="closeDrivePicker()" class="text-slate-400 hover:text-slate-600 cursor-pointer"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <p class="text-xs text-slate-500">คลิกที่รูปภาพจากคลังด้านล่าง เพื่อนำมาปรับตัดส่วน (Crop) ลงในช่องรายงาน</p>
      <div id="drive_photo_grid" class="grid grid-cols-3 gap-3 max-h-96 overflow-y-auto p-1 bg-slate-50 border rounded-xl p-3">
        <p class="col-span-3 text-center text-slate-500 py-6">กำลังโหลดคลังรูปภาพ...</p>
      </div>
      <div class="flex justify-end pt-2 border-t">
        <button onclick="closeDrivePicker()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-xl text-sm cursor-pointer">ปิด</button>
      </div>
    </div>
  </div>

  <!-- Modal ปรับแต่งรูปภาพ (Crop Tool) -->
  <div id="image_editor_modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center hidden no-print">
    <div class="bg-white rounded-2xl p-5 max-w-md w-full mx-4 shadow-2xl border border-slate-200 space-y-3">
      <div class="flex items-center justify-between border-b pb-2">
        <h3 class="font-bold text-base text-slate-800 flex items-center gap-2">
          <i data-lucide="crop" class="w-5 h-5 text-blue-600"></i> ปรับแต่งมุมมองรูปภาพ
        </h3>
        <button onclick="closeImageEditor()" class="text-slate-400 hover:text-slate-600 cursor-pointer"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <!-- พื้นที่ Cropper -->
      <div id="cropper_container" 
           style="aspect-ratio: 4/3;"
           onmousedown="startCropDrag(event)" onmousemove="onCropMove(event)" onmouseup="endCropDrag()" onmouseleave="endCropDrag()"
           ontouchstart="startCropTouch(event)" ontouchmove="onCropTouchMove(event)" ontouchend="endCropDrag()">
        <img id="cropper_image" src="" alt="Source">
        <div class="absolute inset-0 border-2 border-dashed border-white/50 pointer-events-none"></div>
      </div>

      <!-- แผงเลือกสัดส่วนสำเร็จรูป -->
      <div class="flex items-center justify-between gap-1 pt-1">
        <span class="text-xs font-bold text-slate-600">สัดส่วนกรอบ:</span>
        <button onclick="setCropAspect('4:3', this)" class="px-2.5 py-1 bg-blue-600 text-white rounded text-xs font-bold shadow-sm transition aspect-btn">4:3 (รายงาน)</button>
        <button onclick="setCropAspect('1:1', this)" class="px-2.5 py-1 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded text-xs font-bold transition aspect-btn">1:1 (จัตุรัส)</button>
        <button onclick="setCropAspect('16:9', this)" class="px-2.5 py-1 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded text-xs font-bold transition aspect-btn">16:9 (กว้าง)</button>
      </div>

      <div class="space-y-1.5 text-xs text-slate-600 pt-1 border-t">
        <div class="flex items-center justify-between">
          <span>ซูมขยายภาพ:</span>
          <span id="zoom_val" class="font-bold">100%</span>
        </div>
        <input type="range" id="zoom_slider" min="0.5" max="3" step="0.05" value="1" oninput="onZoomChange(this.value)" class="w-full accent-blue-600 cursor-pointer">
        
        <div class="flex gap-2 pt-1">
          <button onclick="rotateCropImage(90)" class="flex-1 bg-slate-100 hover:bg-slate-200 py-1.5 rounded text-xs font-bold flex items-center justify-center gap-1 text-slate-700 cursor-pointer">
            <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i> หมุน 90°
          </button>
          <button onclick="resetCropTransform()" class="px-3 bg-slate-100 hover:bg-slate-200 py-1.5 rounded text-xs font-bold text-slate-700 cursor-pointer flex items-center gap-1">
            <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i> จัดกึ่งกลาง
          </button>
        </div>
      </div>

      <div class="flex gap-2 pt-2 border-t">
        <button onclick="closeImageEditor()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 rounded-xl text-sm cursor-pointer">ยกเลิก</button>
        <button onclick="confirmCroppedImage()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-xl text-sm shadow cursor-pointer">ยืนยันนำลงรายงาน</button>
      </div>
    </div>
  </div>

  <!-- Modal สถานะการทำงาน -->
  <div id="upload_modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden no-print">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-2xl text-center space-y-4">
      <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto animate-pulse"><i data-lucide="cloud-upload" class="w-8 h-8"></i></div>
      <h3 id="upload_modal_title" class="font-bold text-lg text-slate-800">กำลังประมวลผลข้อมูล</h3>
      <p id="upload_modal_desc" class="text-sm text-slate-500">กรุณารอสักครู่...</p>
    </div>
  </div>

  <div class="max-w-7xl w-full grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
    <div class="xl:col-span-8 flex flex-col items-center overflow-x-auto w-full gap-6" id="pages_container"></div>

    <div class="xl:col-span-4 space-y-4 no-print sticky top-6">
      <div class="grid grid-cols-2 gap-3">
        <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl py-3 px-3 font-bold text-sm shadow flex items-center justify-center gap-1.5 cursor-pointer">
          <i data-lucide="printer" class="w-4 h-4"></i> พิมพ์เอกสาร A4
        </button>
        <a href="../Weekly_Reference.html" class="bg-slate-200 hover:bg-slate-300 border border-slate-400 rounded-xl py-3 px-3 text-slate-800 font-bold text-sm text-center flex items-center justify-center gap-1.5 shadow">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> กลับหน้าหลัก
        </a>
      </div>

      <div class="bg-white rounded-xl border border-slate-300 p-4 shadow space-y-3">
        <h4 class="font-bold text-sm text-slate-800 border-b pb-2 flex items-center gap-2">
          <i data-lucide="image" class="w-4 h-4 text-indigo-600"></i> จัดการคลังรูปภาพและรายงาน
        </h4>
        
        <button onclick="document.getElementById('global_batch_upload_input').click()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm shadow flex items-center justify-center gap-1.5 cursor-pointer">
          <i data-lucide="upload-cloud" class="w-4 h-4"></i> 📤 อัปโหลดรูปต้นฉบับเข้า Drive
        </button>

        <div class="flex items-center justify-between pt-2 border-t">
          <span class="text-xs text-slate-500 font-medium">ช่องรูป: <span id="txt_photo_count" class="font-bold text-blue-600">2</span> รูป (<span id="txt_page_count">1</span> หน้า)</span>
          <button onclick="addPhotoSlot()" class="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-300 rounded-lg text-xs font-bold cursor-pointer flex items-center gap-1">
             <i data-lucide="plus" class="w-3.5 h-3.5"></i> เพิ่มช่องรูป
          </button>
        </div>

        <button onclick="saveReportMetadataOnly()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl text-sm shadow flex items-center justify-center gap-1.5 cursor-pointer">
          <i data-lucide="save" class="w-4 h-4"></i> บันทึกข้อมูลรายงานหน้านี้
        </button>
      </div>
    </div>
  </div>

  <script>
    function setCropAspect(ratioStr, btnEl) {
      document.querySelectorAll('.aspect-btn').forEach(b => {
        b.className = "px-2.5 py-1 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded text-xs font-bold transition aspect-btn";
      });
      btnEl.className = "px-2.5 py-1 bg-blue-600 text-white rounded text-xs font-bold shadow-sm transition aspect-btn";

      const container = document.getElementById('cropper_container');
      if (ratioStr === '4:3') container.style.aspectRatio = '4/3';
      else if (ratioStr === '1:1') container.style.aspectRatio = '1/1';
      else if (ratioStr === '16:9') container.style.aspectRatio = '16/9';
      lucide.createIcons();
    }

    lucide.createIcons();
    const urlParams = new URLSearchParams(window.location.search);
    const currentWeekIndex = parseInt(urlParams.get('week')) || 1;
    
    let currentProjectID = 'DEFAULT_PROJ';
    let currentReportMonth = urlParams.get('month') || 'SEP_2569';
    let PHOTO_STORAGE_KEY = `WEEK_PHOTO_DATA_${currentProjectID}_${currentReportMonth}_${currentWeekIndex}`;

    let projectTitle = "โครงการก่อสร้างถนนคอนกรีตเสริมเหล็ก";
    let inspName = "นายพัทธิยะ วงษาซ้าย";
    let inspPos = "ผู้ควบคุมงาน";
    
    // 💡 ตัวแปรสำหรับแสดงผลรายงานครั้งที่, สัปดาห์ที่ และปี
    let weekSeq = currentWeekIndex;
    let weekNum = currentWeekIndex;
    let weekYear = "2569"; 
    
    let commsList = ["นางสาวถนอมนวล วะทวีก้านตรงฯ", "จ่าเอกธีรพงษ์ ดรชานนท์", "นางสาวปนัดดา ภูอาษา", "นายวีระศักดิ์ ทับวิชร", "นายอรรถวัต อดทน"];

    let photosList = [{ src: "", desc: "" }, { src: "", desc: "" }];
    let currentEditingIdx = 0;
    let cropState = { isDragging: false, startX: 0, startY: 0, translateX: 0, translateY: 0, scale: 1, rotation: 0, imgWidth: 0, imgHeight: 0 };

    function toThaiNumber(numStr) {
      if (numStr === null || numStr === undefined) return '';
      const thaiNums = ['๐', '๑', '๒', '๓', '๔', '๕', '๖', '๗', '๘', '๙'];
      return numStr.toString().replace(/[0-9]/g, (w) => thaiNums[w]);
    }

    function thaiDateText(dateStr) {
      if (!dateStr) return '';
      const thaiMonths = { "January": "มกราคม", "February": "กุมภาพันธ์", "March": "มีนาคม", "April": "เมษายน", "May": "พฤษภาคม", "June": "มิถุนายน", "July": "กรกฎาคม", "August": "สิงหาคม", "September": "กันยายน", "October": "ตุลาคม", "November": "พฤศจิกายน", "December": "ธันวาคม" };
      let cleanStr = dateStr.toString().trim();
      for (const [enM, thM] of Object.entries(thaiMonths)) {
        if (cleanStr.toLowerCase().includes(enM.toLowerCase())) cleanStr = cleanStr.replace(new RegExp(enM, 'gi'), thM);
      }
      return toThaiNumber(cleanStr);
    }

    function chunkArray(array, size) {
      const chunked = [];
      for (let i = 0; i < array.length; i += size) chunked.push(array.slice(i, i + size));
      return chunked;
    }

    function renderAllPages() {
      const container = document.getElementById('pages_container');
      container.innerHTML = '';
      document.getElementById('txt_photo_count').textContent = photosList.length;

      const chunks = chunkArray(photosList, 4);
      if (chunks.length === 0) chunks.push([]);
      document.getElementById('txt_page_count').textContent = chunks.length;

      let commHtml = '';
      commsList.forEach((name, idx) => {
        if (!name) return;
        const isPresident = (idx === 0);
        commHtml += `<div class="${isPresident ? 'col-span-2 flex justify-center' : ''}"><div><p>(ลงชื่อ).................................................... ${isPresident ? 'ประธานกรรมการฯ' : 'กรรมการฯ'}</p><p class="mt-0.5">(${name})</p></div></div>`;
      });

      chunks.forEach((chunk, pageIndex) => {
        let gridHtml = '';
        let gridClass = "grid grid-cols-2 gap-4 my-2 flex-1 content-start";
        if (chunk.length === 1) gridClass = "grid grid-cols-1 gap-4 my-2 max-w-md mx-auto flex-1 content-start";
        
        chunk.forEach((item, localIdx) => {
          const globalIdx = pageIndex * 4 + localIdx;
          const hasImg = item.src && item.src.trim() !== "";
          const emptyDescClass = (!item.desc || item.desc.trim() === '') ? 'empty-desc' : '';

          gridHtml += `
            <div class="flex flex-col bg-white">
              <div class="photo-box" onclick="openDrivePicker(${globalIdx})">
                <div class="text-center text-slate-500 p-2 ${hasImg ? 'hidden' : ''}">
                  <i data-lucide="image-plus" class="w-8 h-8 mx-auto mb-1 text-blue-600"></i>
                  <span class="text-xs font-bold">คลิกเลือกภาพที่ ${globalIdx + 1} จากคลัง Drive</span>
                </div>
                <img src="${item.src || ''}" class="${hasImg ? '' : 'hidden'}">
              </div>
              <div class="mt-2 flex items-center gap-1 desc-wrapper ${emptyDescClass}">
                <input type="text" value="${item.desc || ''}" oninput="updatePhotoDesc(${globalIdx}, this.value, this)" class="cell-input-text text-sm font-semibold" placeholder="คำอธิบายภาพ...">
                <button onclick="event.stopPropagation(); removePhotoSlot(${globalIdx})" class="text-rose-500 hover:text-rose-700 p-1 cursor-pointer no-print"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
              </div>
            </div>`;
        });

        container.innerHTML += `
          <div class="sheet-doc">
            <div>
              <div class="text-center mb-1">
                <h2 class="doc-title">ภาพถ่ายสภาพการปฏิบัติงาน</h2>
                <p class="font-bold text-slate-800 text-[16pt] leading-tight">${toThaiNumber(projectTitle)}</p>
                <p class="text-[15pt]">รายงานครั้งที่ <span class="font-bold">${toThaiNumber(weekSeq)}</span> สัปดาห์ที่ <span class="font-bold">${toThaiNumber(weekNum)}/${toThaiNumber(weekYear)}</span></p>
              </div>
              <div class="${gridClass}">${gridHtml}</div>
            </div>
            <div>
              <div class="mt-2 flex justify-end pr-8 text-center">
                <div class="space-y-0.5"><p>(ลงชื่อ)........................................................... <span>${inspPos}</span></p><p>(<span>${inspName}</span>)</p></div>
              </div>
              <div class="mt-2 pt-1 border-t border-slate-300">
                <p class="text-[15pt] font-semibold mb-0.5">- ทราบ / ผลการตรวจสภาพงาน</p>
                <div class="grid grid-cols-2 gap-y-2 gap-x-6 text-center">${commHtml}</div>
              </div>
            </div>
          </div>`;
      });
      lucide.createIcons();
    }

    function updatePhotoDesc(idx, val, el) {
      photosList[idx].desc = val;
      if (val.trim() === '') el.parentElement.classList.add('empty-desc');
      else el.parentElement.classList.remove('empty-desc');
      savePhotosToLocalSafe();
    }

    function savePhotosToLocalSafe() {
      try { localStorage.setItem(PHOTO_STORAGE_KEY, JSON.stringify({ weekIndex: currentWeekIndex, reportMonth: currentReportMonth, photos: photosList })); } catch (err) {}
    }

    async function handleBatchUploadToDrive(e) {
      const files = e.target.files;
      if (!files || files.length === 0) return;

      const basicRaw = localStorage.getItem('LOCAL_BASIC_INFO');
      let imageFolderId = "11fiWOEZwAqUlZ7W3MuYv3Oi6Vbkfo2jd";
      let contractNo = "DEFAULT";
      if (basicRaw) {
        try {
          const pData = JSON.parse(basicRaw);
          imageFolderId = pData.imageFolderId || pData.driveFolderId || imageFolderId;
          contractNo = pData.contractNo || contractNo;
        } catch(e){}
      }

      document.getElementById('upload_modal_title').textContent = "กำลังอัปโหลดรูปต้นฉบับเข้า Drive...";
      document.getElementById('upload_modal_desc').textContent = `กำลังอัปโหลด ${files.length} รูป...`;
      document.getElementById('upload_modal').classList.remove('hidden');

      let count = 0;
      for (let i = 0; i < files.length; i++) {
        const file = files.item(i);
        await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = async function(evt) {
            try {
              const centralUrl = localStorage.getItem('CONSTRUCTION_GAS_URL');
              await fetch(centralUrl, {
                method: 'POST', mode: 'cors', redirect: 'follow',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'upload_original_photo', contractNo: contractNo, folderId: imageFolderId, fileName: `Orig_${Date.now()}_${file.name}`, imageB64: evt.target.result })
              });
              count++;
            } catch(err) {}
            resolve();
          };
          reader.readAsDataURL(file);
        });
      }

      document.getElementById('upload_modal').classList.add('hidden');
      e.target.value = '';
      alert(`อัปโหลดรูปต้นฉบับสำเร็จ ${count} รูปแล้วค่ะ!`);
    }

    async function openDrivePicker(idx) {
      currentEditingIdx = idx;
      const modal = document.getElementById('drive_picker_modal');
      const grid = document.getElementById('drive_photo_grid');
      modal.classList.remove('hidden');
      grid.innerHTML = '<p class="col-span-3 text-center text-slate-500 py-6">กำลังโหลดคลังรูปภาพ...</p>';

      const basicRaw = localStorage.getItem('LOCAL_BASIC_INFO');
      let imageFolderId = "11fiWOEZwAqUlZ7W3MuYv3Oi6Vbkfo2jd";
      let contractNo = "DEFAULT";
      if (basicRaw) {
        try {
          const pData = JSON.parse(basicRaw);
          imageFolderId = pData.imageFolderId || pData.driveFolderId || imageFolderId;
          contractNo = pData.contractNo || contractNo;
        } catch(e){}
      }

      try {
        const centralUrl = localStorage.getItem('CONSTRUCTION_GAS_URL');
        const res = await fetch(`${centralUrl}?action=get_drive_photos&folderId=${imageFolderId}&contractNo=${encodeURIComponent(contractNo)}`);
        const result = await res.json();
        
        if (result.status === 'success' && result.photos && result.photos.length > 0) {
          grid.innerHTML = '';
          result.photos.forEach(p => {
            const previewUrl = p.thumbnailUrl || p.url;
            grid.innerHTML += `
              <div class="border rounded-xl p-2 cursor-pointer hover:border-blue-500 hover:shadow-md bg-white flex flex-col items-center transition" onclick="selectDrivePhotoForCrop('${p.url}')">
                <div class="w-full aspect-4/3 bg-slate-100 rounded-lg overflow-hidden flex items-center justify-center">
                  <img src="${previewUrl}" class="w-full h-full object-cover" crossorigin="anonymous">
                </div>
                <span class="text-[11px] text-slate-700 font-medium truncate w-full text-center mt-1.5">${p.name}</span>
              </div>`;
          });
        } else {
          grid.innerHTML = '<p class="col-span-3 text-center text-slate-500 py-6">ไม่พบรูปในคลัง Drive ของสัญญานี้<br><span class="text-xs text-indigo-600">กรุณากดอัปโหลดรูปต้นฉบับก่อนค่ะ</span></p>';
        }
      } catch (err) {
        grid.innerHTML = '<p class="col-span-3 text-center text-rose-500 py-6">ไม่สามารถโหลดรูปได้</p>';
      }
    }

    function closeDrivePicker() { document.getElementById('drive_picker_modal').classList.add('hidden'); }

    function selectDrivePhotoForCrop(url) {
      closeDrivePicker();
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        loadEditorWithImage(canvas.toDataURL('image/jpeg', 0.9));
      };
      img.src = url;
    }

    function loadEditorWithImage(sourceImage) {
      const modal = document.getElementById('image_editor_modal');
      const cropperImg = document.getElementById('cropper_image');
      cropperImg.src = sourceImage;
      cropperImg.onload = function() {
        cropState.imgWidth = cropperImg.naturalWidth; cropState.imgHeight = cropperImg.naturalHeight;
        cropState.scale = 1; cropState.translateX = 0; cropState.translateY = 0; cropState.rotation = 0;
        document.getElementById('zoom_slider').value = 1; document.getElementById('zoom_val').textContent = '100%';
        updateCropperTransform();
        modal.classList.remove('hidden');
      };
    }

    function closeImageEditor() { document.getElementById('image_editor_modal').classList.add('hidden'); }

    function startCropDrag(e) { cropState.isDragging = true; cropState.startX = e.clientX - cropState.translateX; cropState.startY = e.clientY - cropState.translateY; }
    function onCropMove(e) { if (!cropState.isDragging) return; cropState.translateX = e.clientX - cropState.startX; cropState.translateY = e.clientY - cropState.startY; updateCropperTransform(); }
    function endCropDrag() { cropState.isDragging = false; }
    function startCropTouch(e) { if (e.touches.length === 1) { cropState.isDragging = true; cropState.startX = e.touches[0].clientX - cropState.translateX; cropState.startY = e.touches[0].clientY - cropState.translateY; } }
    function onCropTouchMove(e) { if (!cropState.isDragging || e.touches.length !== 1) return; cropState.translateX = e.touches[0].clientX - cropState.startX; cropState.translateY = e.touches[0].clientY - cropState.startY; updateCropperTransform(); }
    function onZoomChange(val) { cropState.scale = parseFloat(val); document.getElementById('zoom_val').textContent = Math.round(cropState.scale * 100) + '%'; updateCropperTransform(); }
    function rotateCropImage(deg) { cropState.rotation = (cropState.rotation + deg) % 360; updateCropperTransform(); }
    function resetCropTransform() { cropState.scale = 1; cropState.translateX = 0; cropState.translateY = 0; cropState.rotation = 0; document.getElementById('zoom_slider').value = 1; document.getElementById('zoom_val').textContent = '100%'; updateCropperTransform(); }
    function updateCropperTransform() { const img = document.getElementById('cropper_image'); if (img) { img.style.transform = `translate(calc(-50% + ${cropState.translateX}px), calc(-50% + ${cropState.translateY}px)) scale(${cropState.scale}) rotate(${cropState.rotation}deg)`; img.style.top = '50%'; img.style.left = '50%'; } }

    function confirmCroppedImage() {
      const item = photosList[currentEditingIdx];
      const img = document.getElementById('cropper_image');
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 800; canvas.height = 600;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(canvas.width / 2 + cropState.translateX, canvas.height / 2 + cropState.translateY);
      ctx.rotate((cropState.rotation * Math.PI) / 180);
      ctx.scale(cropState.scale, cropState.scale);
      const ratio = Math.max(canvas.width / img.naturalWidth, canvas.height / img.naturalHeight);
      ctx.drawImage(img, -img.naturalWidth * ratio / 2, -img.naturalHeight * ratio / 2, img.naturalWidth * ratio, img.naturalHeight * ratio);
      ctx.restore();

      item.src = canvas.toDataURL('image/jpeg', 0.85);
      renderAllPages();
      closeImageEditor();
      savePhotosToLocalSafe();
    }

    function addPhotoSlot() { photosList.push({ src: "", desc: "" }); renderAllPages(); savePhotosToLocalSafe(); }
    function removePhotoSlot(idx) { if (photosList.length <= 1) return alert("ต้องมีช่องรูปอย่างน้อย 1 ช่องค่ะ"); photosList.splice(idx, 1); renderAllPages(); savePhotosToLocalSafe(); }
    function saveReportMetadataOnly() { savePhotosToLocalSafe(); alert("บันทึกข้อมูลรายงานเรียบร้อยแล้วค่ะ!"); }

    function loadProjectAndPhotoData() {
      // 1. ดึงข้อมูลโครงการเบื้องต้น
      const basicRaw = localStorage.getItem('LOCAL_BASIC_INFO');
      if (basicRaw) {
        try {
          let projectData = JSON.parse(basicRaw);
          if (projectData.contractNo) {
            currentProjectID = `PROJ_${projectData.contractNo.replace(/[^a-zA-Z0-9]/g, '_')}`;
            currentReportMonth = urlParams.get('month') || localStorage.getItem(`LAST_ACTIVE_REPORT_MONTH_${currentProjectID}`) || 'SEP_2569';
            PHOTO_STORAGE_KEY = `WEEK_PHOTO_DATA_${currentProjectID}_${currentReportMonth}_${currentWeekIndex}`;
          }
          if (projectData.projectName) projectTitle = projectData.projectName;
          if (projectData.inspectors && projectData.inspectors[0] && projectData.inspectors[0].name) { inspName = projectData.inspectors[0].name; inspPos = projectData.inspectors[0].pos; }
          if (projectData.committees && projectData.committees.length > 0) commsList = projectData.committees;
        } catch(e){}
      }

      // 2. 💡 ดึงข้อมูลสัปดาห์ (seq, week, year) จากฐานข้อมูลอ้างอิงให้ตรงกับความเป็นจริง
      const refDataRaw = localStorage.getItem(`CONSTRUCTION_WEEKLY_REF_DB_${currentProjectID}_${currentReportMonth}`) || 
                         localStorage.getItem(`CONSTRUCTION_WEEKLY_REF_DB_${currentProjectID}`) || 
                         localStorage.getItem('CONSTRUCTION_WEEKLY_REF_DB');

      if (refDataRaw) {
        try {
          const weeks = JSON.parse(refDataRaw);
          const wItem = weeks.find(w => parseInt(w.weekIndex) === currentWeekIndex);
          if (wItem) {
            if (wItem.seq) weekSeq = wItem.seq;
            if (wItem.week) weekNum = wItem.week;
            
            // ดึงปี พ.ศ. จาก startDate (ตัวอย่าง format: "23 สิงหาคม 2569")
            if (wItem.startDate) {
               const parts = wItem.startDate.split(' ');
               if (parts.length >= 3) {
                 weekYear = parts[2];
               }
            }
          }
        } catch (e) {}
      }

      // 3. โหลดภาพที่เคยบันทึก
      const cached = localStorage.getItem(PHOTO_STORAGE_KEY) || localStorage.getItem(`WEEK_PHOTO_DATA_${currentWeekIndex}`);
      if (cached) { try { const data = JSON.parse(cached); if (data.photos) photosList = data.photos; } catch(e) {} }
      
      renderAllPages();
    }

    window.addEventListener('DOMContentLoaded', loadProjectAndPhotoData);
  </script>
</body>
