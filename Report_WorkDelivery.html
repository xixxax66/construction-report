<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายงานวันถึงกำหนดส่งมอบงานของผู้รับจ้าง</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../assets/gas-sync.js"></script>
  <style>
    @font-face {
      font-family: 'THSarabunPSK';
      src: url('assets/THSarabun.ttf') format('truetype'),
           url('../assets/THSarabun.ttf') format('truetype');
      font-weight: normal;
    }
    @font-face {
      font-family: 'THSarabunPSK';
      src: url('assets/THSarabun Bold.ttf') format('truetype'),
           url('../assets/THSarabun Bold.ttf') format('truetype');
      font-weight: bold;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    body {
      font-family: 'THSarabunPSK', 'Sarabun', sans-serif;
      background-color: #94a3b8;
      margin: 0;
      padding: 0;
      font-size: 16pt;
      line-height: 1.15;
    }

    .sheet-doc {
      width: 210mm;
      min-height: 297mm;
      padding: 15mm 20mm 15mm 25mm;
      margin: 15px auto;
      background: white;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
      color: #000;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .sheet-doc p,
    .sheet-doc span,
    .sheet-doc td,
    .sheet-doc label,
    .sheet-doc div {
      font-size: 16pt;
      line-height: 1.25;
    }

    .sheet-doc .font-bold,
    .sheet-doc b,
    .sheet-doc strong {
      font-family: 'THSarabunPSK', sans-serif;
      font-weight: bold;
    }

    .doc-title {
      font-size: 26pt !important;
      font-weight: bold;
      line-height: 1;
    }

    .garuda-img {
      width: 1.5cm;
      height: auto;
      position: absolute;
      left: 0;
      top: 0;
    }

    .indent-word {
      text-indent: 1.8cm !important;
    }

    .dotted-line {
      border-bottom: 1px dotted #000;
    }

    .pen-dotted-lines {
      width: 100%;
      height: 1.25em;
      border-bottom: 1px dotted #000;
      margin-bottom: 4px;
    }
    .opinion-box {
      margin-bottom: 20px;
    }

    .btn-3d {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }
    .custom-table td, .purple-table td {
      font-size: 14pt !important;
    }

    @media print {
      body {
        background: white !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print {
        display: none !important;
      }
      .sheet-doc {
        box-shadow: none !important;
        margin: 0 auto !important;
        width: 210mm !important;
        height: 297mm !important;
        padding: 15mm 20mm 15mm 25mm !important;
        page-break-after: always;
      }
      .sheet-doc:last-child {
        page-break-after: auto;
      }
    }
  </style>
</head>
<body class="p-2 sm:p-6 min-h-screen flex justify-center">
  <div class="max-w-7xl w-full grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
    
    <!-- ฝั่งแสดงแผ่นกระดาษเอกสาร -->
    <div class="xl:col-span-8 flex flex-col items-center w-full gap-6" id="pages_container"></div>

    <!-- แผงควบคุมด้านขวา -->
    <div class="xl:col-span-4 space-y-4 no-print sticky top-4">
      <div class="grid grid-cols-2 gap-3">
        <button onclick="window.print()" class="btn-3d flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl py-3 px-3 font-bold text-sm shadow cursor-pointer">
          <i data-lucide="printer" class="w-5 h-5"></i>
          <span>พิมพ์บันทึกข้อความ</span>
        </button>
        <a href="index.html" class="btn-3d flex items-center justify-center gap-2 bg-gradient-to-b from-slate-100 to-slate-300 hover:to-slate-200 border border-slate-400 rounded-xl py-3 px-3 text-slate-800 font-bold text-sm shadow">
          <img src="https://cdn-icons-png.flaticon.com/512/619/619032.png" alt="Home" class="w-5 h-5 object-contain">
          <span>กลับหน้าหลัก</span>
        </a>
      </div>

      <!-- กล่องจัดการผู้ลงนามเพิ่มเติม (แสดงเฉพาะตอนเลือกนำเรียนผู้บริหาร) -->
      <div id="box_extra_signers" class="bg-white p-4 rounded-2xl shadow border-2 border-purple-300 space-y-3" style="display: none;">
        <h3 class="font-bold text-slate-800 text-lg border-b pb-2 flex items-center gap-2">
          <i data-lucide="users" class="w-5 h-5 text-purple-700"></i> จัดการผู้ลงนามเพิ่มเติม
        </h3>
        <p class="text-xs text-slate-600 font-semibold">เพิ่มหรือแก้ไขตำแหน่งผู้ลงนามในหน้าที่ 2 (เช่น รองปลัด, ปลัด, นายก)</p>
        
        <div id="signer_controls_list" class="space-y-2.5 max-h-60 overflow-y-auto pr-1"></div>

        <button onclick="addSignerRow()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-2 px-4 rounded-xl text-sm flex items-center justify-center gap-2 shadow cursor-pointer border-2 border-slate-300">
          <i data-lucide="plus" class="w-4 h-4"></i> เพิ่มผู้ลงนาม
        </button>
      </div>

      <div class="bg-white rounded-xl border-2 border-purple-800 shadow-md overflow-hidden">
        <div class="bg-purple-800 text-white text-xs font-bold px-3 py-1.5 flex justify-between items-center">
          <span>ตั้งค่าผู้รับและข้อมูลรายงาน</span>
          <i data-lucide="settings" class="w-4 h-4"></i>
        </div>
        <table class="w-full text-sm custom-table">
          <tr>
            <td class="bg-purple-100 font-bold text-purple-900 w-44">นำเรียน (ผู้รับ)</td>
            <td class="bg-white p-1">
              <select id="in_recipientType" onchange="renderPages()" class="w-full p-1 border rounded font-medium text-slate-800">
                <option value="committee" selected>ประธานกรรมการตรวจรับพัสดุ</option>
                <option value="mayor">ผู้บริหาร (ผ่านประธานฯ)</option>
              </select>
            </td>
          </tr>
          <tr>
            <td class="bg-purple-100 font-bold text-purple-900">วันที่รายงาน</td>
            <td class="bg-white p-1"><input type="text" id="in_reportDate" oninput="autoThaiNum(this); renderPages()" class="w-full p-1 text-slate-800 border rounded text-center font-medium" value="๑๑ มิถุนายน ๒๕๖๙"></td>
          </tr>
          <tr>
            <td class="bg-purple-100 font-bold text-purple-900">สถานะการทำงาน</td>
            <td class="bg-white p-1">
              <select id="in_workStatus" onchange="renderPages()" class="w-full p-1 border rounded font-medium text-slate-800">
                <option value="ยังไม่เข้าดำเนินงานตามสัญญาจ้าง" selected>ยังไม่เข้าดำเนินงานตามสัญญาจ้าง</option>
                <option value="เข้าดำเนินงานตามสัญญาจ้าง">เข้าดำเนินงานตามสัญญาจ้าง</option>
              </select>
            </td>
          </tr>
          <tr>
            <td class="bg-purple-100 font-bold text-purple-900">สถานะการส่งงาน</td>
            <td class="bg-white p-1">
              <select id="in_deliveryStatus" onchange="renderPages()" class="w-full p-1 border rounded font-medium text-slate-800">
                <option value="ส่งมอบงวดงานจ้างแล้ว" selected>ส่งมอบงวดงานจ้างแล้ว</option>
                <option value="ยังไม่ส่งมอบงวดงานจ้าง">ยังไม่ส่งมอบงวดงานจ้าง</option>
              </select>
            </td>
          </tr>
          <tr>
            <td class="bg-purple-100 font-bold text-purple-900">วันที่ส่งงาน(กรณีส่งงานแล้ว)</td>
            <td class="bg-white p-1"><input type="text" id="in_sentDate" oninput="autoThaiNum(this); renderPages()" class="w-full p-1 border rounded text-center" placeholder="เช่น ๑๐ มิถุนายน ๒๕๖๙"></td>
          </tr>
          <tr>
            <td class="bg-purple-100 font-bold text-purple-900">ผลการปฏิบัติตามสัญญา</td>
            <td class="bg-white p-1">
              <select id="in_contractCompliance" onchange="renderPages()" class="w-full p-1 border rounded font-medium text-slate-800">
                <option value="ไม่เป็นไปตามสัญญาจ้าง เนื่องจากล่าช้ากว่าวันที่กำหนดในสัญญาจ้าง" selected>ไม่เป็นไปตามสัญญาจ้าง เนื่องจากล่าช้ากว่าวันที่กำหนด</option>
                <option value="แล้วเสร็จตามที่กำหนด">แล้วเสร็จตามที่กำหนด</option>
              </select>
            </td>
          </tr>
          <tr>
            <td class="bg-purple-100 font-bold text-purple-900">วันถึงกำหนดส่งมอบงวดงาน</td>
            <td class="bg-white p-1"><input type="text" id="in_dueDate" oninput="autoThaiNum(this); renderPages()" class="w-full p-1 font-semibold border rounded text-center" value="๒๓ ตุลาคม ๒๕๖๙"></td>
          </tr>
        </table>
        <div class="p-2 bg-slate-50 border-t flex justify-end">
          <button onclick="saveDeliveryRecord()" class="text-xs bg-purple-700 hover:bg-purple-800 text-white font-medium py-1 px-3 rounded shadow cursor-pointer">บันทึกข้อมูลรายงาน</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    let currentProjectID = 'DEFAULT_PROJ';
    let globalProjectData = {};

    let extraSigners = [
      { name: "นางสาวประภาพร ศิริมูล", pos: "รองปลัดองค์การบริหารส่วนตำบลโพนงาม" },
      { name: "นางสาวเบญจมาภรณ์ ชามะรัตน์", pos: "ปลัดองค์การบริหารส่วนตำบลโพนงาม" },
      { name: "นายชาญยุทธ ตวงพลจันทร์", pos: "นายกองค์การบริหารส่วนตำบลโพนงาม" }
    ];

    function initProjectContext() {
      const basicRaw = localStorage.getItem('LOCAL_BASIC_INFO');
      if (basicRaw) {
        try {
          const projectData = JSON.parse(basicRaw);
          const cNo = projectData.contractNo || 'E1_2569';
          currentProjectID = `PROJ_${cNo.replace(/[^a-zA-Z0-9]/g, '_')}`;
        } catch(e) {}
      }
    }

    function toThaiNumber(numStr) {
      if (numStr === null || numStr === undefined) return '';
      const thaiNums = ['๐', '๑', '๒', '๓', '๔', '๕', '๖', '๗', '๘', '๙'];
      return numStr.toString().replace(/[0-9]/g, (w) => thaiNums[w]);
    }

    function autoThaiNum(el) {
      el.value = toThaiNumber(el.value);
    }

    function renderSignerControls() {
      const container = document.getElementById('signer_controls_list');
      if (!container) return;
      container.innerHTML = '';
      
      extraSigners.forEach((sig, idx) => {
        container.innerHTML += `
          <div class="flex items-center gap-2 bg-slate-50 p-2.5 rounded-xl border-2 border-slate-200 shadow-sm">
            <div class="flex-1 space-y-1.5">
              <input type="text" class="w-full text-sm p-1.5 border rounded bg-white font-bold text-slate-800" placeholder="ชื่อ-นามสกุล" value="${sig.name}" oninput="extraSigners[${idx}].name = this.value; renderPages();">
              <input type="text" class="w-full text-xs p-1.5 border rounded bg-white font-medium text-slate-700" placeholder="ตำแหน่ง" value="${sig.pos}" oninput="extraSigners[${idx}].pos = this.value; renderPages();">
            </div>
            <button onclick="removeSignerRow(${idx})" class="text-rose-600 hover:text-rose-800 p-2 bg-rose-100 rounded-lg hover:bg-rose-200 transition cursor-pointer"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
        `;
      });
      lucide.createIcons();
    }

    function addSignerRow() {
      extraSigners.push({ name: "", pos: "รองปลัดองค์การบริหารส่วนตำบล" });
      renderSignerControls();
      renderPages();
    }

    function removeSignerRow(idx) {
      extraSigners.splice(idx, 1);
      renderSignerControls();
      renderPages();
    }

    function renderPages() {
      const container = document.getElementById('pages_container');
      const boxExtra = document.getElementById('box_extra_signers');
      if (!container) return;

      const recipientType = document.getElementById('in_recipientType').value;
      const repDate = document.getElementById('in_reportDate').value;
      const workStatus = document.getElementById('in_workStatus').value;
      const deliveryStatus = document.getElementById('in_deliveryStatus').value;
      const sentDate = document.getElementById('in_sentDate').value;
      const compliance = document.getElementById('in_contractCompliance').value;
      const dueDate = document.getElementById('in_dueDate').value;

      const pData = globalProjectData;
      const org = pData.organizationName || 'องค์การบริหารส่วนตำบลโพนงาม';

      let recipientText = 'ประธานกรรมการตรวจรับพัสดุ';
      let actionSuffix = 'และพิจารณา';

      if (recipientType === 'mayor') {
        if (boxExtra) boxExtra.style.display = 'block';
        const topMayor = extraSigners.find(s => s.pos.includes('นายก')) || { pos: `นายก${org}` };
        recipientText = `${toThaiNumber(topMayor.pos)} ผ่านประธานกรรมการตรวจรับพัสดุ`;
        actionSuffix = 'และพิจารณาสั่งการ';
      } else {
        if (boxExtra) boxExtra.style.display = 'none';
      }

      let deliveryText = deliveryStatus;
      if (deliveryStatus === 'ส่งมอบงวดงานจ้างแล้ว' && sentDate.trim() !== '') {
        deliveryText = `ได้ส่งมอบงวดงานจ้างแล้ว เมื่อวันที่ ${toThaiNumber(sentDate)}`;
      }

      // ดึงรายชื่อผู้ควบคุมงาน
      const inspectors = pData.inspectors && pData.inspectors.length > 0 ? pData.inspectors : [{ name: 'นายพัทธิยะ วงษาซ้าย', pos: 'ผู้ควบคุมงาน' }];
      let inspHTML = "";
      inspectors.forEach(insp => {
        if (insp.name) {
          inspHTML += `
            <div class="space-y-0.5 text-center min-w-[220px]">
              <p>(ลงชื่อ)........................................................... ${toThaiNumber(insp.pos)}</p>
              <p class="font-normal" style="position: relative; right: 12px;">(${toThaiNumber(insp.name)})</p>
            </div>
          `;
        }
      });

      // --- รายชื่อคณะกรรมการ ---
      const comms = pData.committees && pData.committees.length > 0 ? pData.committees : [
        "นางสาวถนอมนวล วะทวีก้านตรงฯ", "จ่าเอกธีรพงษ์ ดรชานนท์", "นางสาวปนัดดา ภูอาษา", "นายวีระศักดิ์ ทับวิชร", "นายอรรถวัต อดทน"
      ];
      let commsHtml = '';
      comms.forEach((name, idx) => {
        if (!name) return;
        const isPresident = (idx === 0);
        const roleText = isPresident ? 'ประธานกรรมการฯ' : 'กรรมการฯ';
        const colSpanClass = isPresident ? 'col-span-2 flex justify-center mb-0.5' : '';
        const nameStyle = isPresident ? 'style="position: relative; right: 24px; font-weight: normal;"' : 'style="font-weight: normal;"';
        commsHtml += `
          <div class="${colSpanClass}">
            <div>
              <p>(ลงชื่อ).................................................... ${roleText}</p>
              <p class="mt-0.5" ${nameStyle}>(${toThaiNumber(name)})</p>
            </div>
          </div>
        `;
      });

      // --- หน้าที่ 1 (บรรจุเนื้อหาหลัก, ผู้ควบคุมงาน และคณะกรรมการตรวจรับพัสดุ) ---
      let page1Html = `
        <div class="sheet-doc">
          <div>
            <div class="relative text-center mb-4">
                <img src="assets/Krut.png" alt="ตราครุฑ" class="garuda-img" onerror="this.src='../assets/Krut.png'">
                <h2 class="doc-title pt-1">บันทึกข้อความ</h2>
            </div>
            <div class="space-y-1 text-base">
              <div class="flex flex-wrap items-baseline">
                <span class="font-bold w-24">ส่วนราชการ</span>
                <span class="flex-1 font-medium">กองช่าง ${toThaiNumber(org)}</span>
              </div>
              <div class="flex justify-between items-baseline">
                <div class="flex items-baseline flex-1">
                  <span class="font-bold w-12">ที่</span>
                  <span class="flex-1">-</span>
                </div>
                <div class="flex-1 text-left">
                  <span class="font-bold mr-2">วันที่</span>
                  <span class="font-medium">${toThaiNumber(repDate)}</span>
                </div>
              </div>
              <div class="flex items-baseline justify-between pb-1 dotted-line">
                <div class="flex items-baseline flex-1">
                  <span class="font-bold w-12">เรื่อง</span>
                  <span class="flex-1 font-medium">รายงานวันถึงกำหนดส่งมอบงานของผู้รับจ้างตามข้อกำหนดของสัญญา ตามระเบียบกระทรวงการคลังว่าด้วยการจัดซื้อจัดจ้างและการบริหารพัสดุภาครัฐ พ.ศ. ๒๕๖๐ ข้อ ๑๗๘(๔)</span>
                </div>
              </div>
            </div>
            <div class="mt-2 text-base">
              <p><span class="font-bold">เรียน</span> ${recipientText}</p>
            </div>
            <div class="mt-2 text-base leading-relaxed text-justify space-y-2">
              <p class="indent-16">
                ตามคำสั่ง${toThaiNumber(org)} ที่ <span id="p_orderNo">${toThaiNumber(pData.orderNo || '๑๐๒/๒๕๖๙')}</span> ลงวันที่ <span id="p_orderDate">${toThaiNumber(pData.orderDate || '๑๑ พฤษภาคม ๒๕๖๙')}</span> แต่งตั้งข้าพเจ้า เป็นผู้ควบคุมงาน และสัญญาจ้างเลขที่ <span id="p_contractNo">${toThaiNumber(pData.contractNo || 'E๑/๒๕๖๙')}</span> ลงวันที่ <span id="p_contractDate">${toThaiNumber(pData.contractDate || '๕ มิถุนายน ๒๕๖๙')}</span> ว่าจ้าง <span id="p_contractor">${toThaiNumber(pData.contractorName || 'ห้างหุ้นส่วนจำกัด เค.เค.มุกดาหารก่อสร้าง')}</span> ทำงาน<span id="p_projectTitle">${toThaiNumber(pData.projectName || 'โครงการก่อสร้างถนนคอนกรีตเสริมเหล็ก')}</span> สถานที่ก่อสร้าง <span id="p_location">${toThaiNumber(pData.projectLocation || 'หมู่ที่ ๑๒ ต.โพนงาม อ.โกสุมพิสัย จ.มหาสารคาม')}</span>
              </p>
              <p class="indent-16">
                บัดนี้ ผู้รับจ้าง<span>${workStatus}</span> และ<span>${deliveryText}</span> โดยผลการปฏิบัติงานของผู้รับจ้าง ดำเนินการ<span>${compliance}</span> ซึ่งกำหนดแล้วเสร็จในวันที่ <span class="font-normal">${toThaiNumber(dueDate)}</span>
              </p>
              <p class="indent-16 pt-2">
                จึงเรียนมาเพื่อโปรดทราบ${actionSuffix}
              </p>
            </div>
          </div>

          <div>
            <div class="mt-2 flex flex-wrap justify-end gap-x-8 gap-y-2 pr-6 pt-4 text-center text-base">
              ${inspHTML}
            </div>
            <div class="mt-6 pt-4 border-t pt-2 border-slate-300">
              <p class="text-base font-semibold mb-1 pt-2">- ทราบ</p>
              <p class="text-xs text-slate-400 mb-2">.........................................................................................................................................................................</p>
              <div class="grid grid-cols-2 gap-y-3 gap-x-4 pt-6 text-center text-base">
                ${commsHtml}
              </div>
            </div>
          </div>
        </div>
      `;

      if (recipientType === 'committee') {
        container.innerHTML = page1Html;
      } else {
        // --- กรณีนำเรียนผู้บริหาร: หน้าที่ 1 มีคณะกรรมการแล้ว หน้าที่ 2 มีความเห็นและลงชื่อผู้บริหารเพิ่มเติม ---
        let extraHtml = '';
        extraSigners.forEach(sig => {
          if (sig.name) {
            const isMayor = sig.pos.includes('นายก');
            const titleText = isMayor ? `ความเห็น/คำสั่ง${toThaiNumber(sig.pos)}` : `ความเห็น${toThaiNumber(sig.pos)}`;
            extraHtml += `
              <div class="mt-4 text-left pt-3 border-t border-slate-300">
                <p class="font-normal mb-2">${titleText}</p>
                <div class="opinion-box" style="margin-bottom: 35px;">
                  <div class="pen-dotted-lines"></div>
                  <div class="pen-dotted-lines"></div>
                </div>
                <div class="text-center mt-2">
                  <p>(ลงชื่อ)........................................................................................</p>
                  <p class="font-normal mt-0.5">(${toThaiNumber(sig.name)})</p>
                  <p class="text-sm text-slate-700">${toThaiNumber(sig.pos)}</p>
                </div>
              </div>`;
          }
        });

        const page2Html = `
          <div class="sheet-doc">
            <div>
              <div class="text-center text-xs text-slate-600 font-normal pb-1">
                - ๒ -
              </div>

              <div class="pt-2">
                ${extraHtml}
              </div>
            </div>

            <div class="text-center text-xs text-slate-400 pb-1">
              - แผ่นที่ 2 / 2 -
            </div>
          </div>
        `;

        container.innerHTML = page1Html + page2Html;
      }
      lucide.createIcons();
    }

    function loadProjectData() {
      initProjectContext();
      const raw = localStorage.getItem(`LOCAL_BASIC_INFO_${currentProjectID}`) || localStorage.getItem('LOCAL_BASIC_INFO');
      if (!raw) return;
      const data = JSON.parse(raw);
      globalProjectData = data;

      if (data.endDateTh) {
        document.getElementById('in_dueDate').value = toThaiNumber(data.endDateTh);
      }
      renderSignerControls();
      renderPages();
    }

    function getStorageKeyDelivery() {
      return `LOCAL_DELIVERY_RECORD_${currentProjectID}`;
    }

    function saveDeliveryRecord() {
      const payload = {
        recipientType: document.getElementById('in_recipientType').value,
        extraSigners: extraSigners,
        reportDate: document.getElementById('in_reportDate').value,
        workStatus: document.getElementById('in_workStatus').value,
        deliveryStatus: document.getElementById('in_deliveryStatus').value,
        sentDate: document.getElementById('in_sentDate').value,
        compliance: document.getElementById('in_contractCompliance').value,
        dueDate: document.getElementById('in_dueDate').value,
        savedAt: new Date().toLocaleString('th-TH')
      };
      localStorage.setItem(getStorageKeyDelivery(), JSON.stringify(payload));
      localStorage.setItem('LOCAL_DELIVERY_RECORD', JSON.stringify(payload));
      alert('บันทึกการตั้งค่ารายงานถึงกำหนดส่งมอบงานเรียบร้อยแล้วค่ะ');
    }

    window.addEventListener('DOMContentLoaded', () => {
      initProjectContext();
      loadProjectData();
      
      const cached = localStorage.getItem(getStorageKeyDelivery()) || localStorage.getItem('LOCAL_DELIVERY_RECORD');
      if (cached) {
        const item = JSON.parse(cached);
        if (item.recipientType) document.getElementById('in_recipientType').value = item.recipientType;
        if (item.extraSigners) extraSigners = item.extraSigners;
        if (item.reportDate) document.getElementById('in_reportDate').value = toThaiNumber(item.reportDate);
        if (item.workStatus) document.getElementById('in_workStatus').value = item.workStatus;
        if (item.deliveryStatus) document.getElementById('in_deliveryStatus').value = item.deliveryStatus;
        if (item.sentDate) document.getElementById('in_sentDate').value = toThaiNumber(item.sentDate);
        if (item.compliance) document.getElementById('in_contractCompliance').value = item.compliance;
        if (item.dueDate) document.getElementById('in_dueDate').value = toThaiNumber(item.dueDate);
      }
      renderSignerControls();
      renderPages();
    });
  </script>
</body>
</html>
