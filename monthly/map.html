<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แผนที่แสดงที่ตั้งโครงการ - รายงานประจำเดือน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../assets/gas-sync.js"></script>
  <style>
    @font-face { font-family: 'THSarabunPSK'; src: url('../assets/THSarabun.ttf') format('truetype'); font-weight: normal; }
    @font-face { font-family: 'THSarabunPSK'; src: url('../assets/THSarabun Bold.ttf') format('truetype'); font-weight: bold; }
    @page { size: A4 portrait; margin: 0; }
    body { font-family: 'THSarabunPSK', sans-serif; background-color: #94a3b8; margin: 0; padding: 0; }
    
    .sheet-doc {
      width: 210mm;
      min-height: 297mm;
      padding: 20mm 20mm 15mm 20mm;
      margin: 20px auto;
      background: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      color: #000;
    }

    .doc-title {
      font-size: 24pt !important;
      font-weight: bold;
      text-align: center;
      margin-bottom: 8px;
    }

    .project-desc {
      font-size: 16pt !important;
      line-height: 1.25;
      text-align: center;
      margin-bottom: 15px;
      padding: 0 5mm;
    }

    .map-frame {
      flex-grow: 1;
      border: 1.5px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: #f8fafc;
      min-height: 180mm;
    }

    .map-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: pointer;
    }

    .map-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #64748b;
      cursor: pointer;
      text-align: center;
      padding: 20px;
    }

    .footer-org {
      text-align: right;
      font-size: 16pt !important;
      margin-top: 10px;
    }

    @media print {
      body { background: white !important; padding: 0 !important; }
      .no-print { display: none !important; }
      .sheet-doc { box-shadow: none !important; margin: 0 !important; width: 210mm !important; height: 297mm !important; padding: 20mm 20mm 15mm 20mm !important; }
    }
  </style>
</head>
<body class="p-2 sm:p-6 min-h-screen flex flex-col items-center">

  <!-- ซ่อน input สำหรับอัปโหลดภาพแผนที่ -->
  <input type="file" id="map_file_input" accept="image/*" class="hidden" onchange="processMapUpload(event)">

  <!-- แผงควบคุมด้านบน -->
  <div class="max-w-6xl w-full mb-4 bg-white p-5 rounded-2xl shadow-lg border border-slate-300 flex flex-wrap items-center justify-between gap-4 no-print">
    <div class="flex items-center gap-3">
      <a id="btn_back_menu" href="../Monthly_Reference.html" class="p-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-700 flex items-center gap-2 text-2xl font-bold border border-slate-300 shadow-sm">
        <i data-lucide="arrow-left" class="w-6 h-6"></i> กลับเมนู
      </a>
      <div>
        <span class="font-bold text-slate-800 text-2xl block">แผนที่แสดงที่ตั้งโครงการ</span>
        <span id="lbl_badge_contract" class="text-xs text-slate-500 font-bold">สัญญา: -</span>
      </div>
    </div>
    
    <div class="flex items-center gap-3 flex-wrap">
      <button id="btn_upload_map" onclick="document.getElementById('map_file_input').click()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl text-xl font-bold flex items-center gap-2 shadow cursor-pointer transition">
        <i data-lucide="cloud-upload" class="w-5 h-5"></i> อัปโหลดรูปขึ้น Drive
      </button>
      <button onclick="deleteMapImage()" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2.5 rounded-xl text-xl font-bold flex items-center gap-2 shadow cursor-pointer transition">
        <i data-lucide="trash-2" class="w-5 h-5"></i> ลบรูปแผนที่
      </button>
      <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-xl font-bold flex items-center gap-2 shadow cursor-pointer transition">
        <i data-lucide="printer" class="w-5 h-5"></i> พิมพ์แผนที่
      </button>
    </div>
  </div>

  <!-- แผ่นกระดาษ A4 -->
  <div class="sheet-doc" id="doc-print">
    <div>
      <h2 class="doc-title">แผนที่แสดงที่ตั้งโครงการ</h2>
      <p class="project-desc" id="lbl_project_desc">
        กำลังโหลดข้อมูลโครงการจากฐานข้อมูล...
      </p>
    </div>

    <!-- กรอบแสดงรูปภาพแผนที่ -->
    <div class="map-frame" onclick="document.getElementById('map_file_input').click()" title="คลิกเพื่ออัปโหลดหรือเปลี่ยนรูปแผนที่">
      <div id="map_placeholder" class="map-placeholder">
        <i data-lucide="map" class="w-16 h-16 text-slate-400"></i>
        <span class="text-lg font-bold">คลิกที่นี่เพื่ออัปโหลดรูปภาพแผนที่แสดงที่ตั้งโครงการ</span>
        <span class="text-sm text-slate-500">(รองรับไฟล์รูปภาพ JPG, PNG)</span>
      </div>
      <img id="map_image_preview" class="map-img hidden" alt="แผนที่แสดงที่ตั้งโครงการ">
    </div>

    <div class="footer-org" id="lbl_footer_org">
      องค์การบริหารส่วนตำบลโพนงาม
    </div>
  </div>

  <script>
    lucide.createIcons();
    
    let currentProjectID = 'DEFAULT_PROJ';
    let currentContractNo = 'DEFAULT';
    let currentDriveFolderId = '';
    let MAP_STORAGE_KEY = `PROJECT_MAP_IMAGE_DATA_${currentProjectID}`;

    const GOOGLE_SCRIPT_URL = localStorage.getItem('CONSTRUCTION_GAS_URL') || 'https://script.google.com/macros/s/AKfycbyNk1gc_9FAtu0ByIBbcgzmK561YpShTklJaf-gCnBnrRHwW0W-L4aeos5fXarrI3Ft/exec';

    function initProjectContext() {
      const urlParams = new URLSearchParams(window.location.search);
      const paramProj = urlParams.get('projectID');
      const paramContract = urlParams.get('contractNo');

      let basicData = null;
      if (paramProj) {
        const raw = localStorage.getItem(`LOCAL_BASIC_INFO_${paramProj}`);
        if (raw) { try { basicData = JSON.parse(raw); } catch(e){} }
      }

      if (!basicData) {
        const raw = localStorage.getItem('LOCAL_BASIC_INFO');
        if (raw) { try { basicData = JSON.parse(raw); } catch(e){} }
      }

      if (basicData) {
        currentContractNo = paramContract || basicData.contractNo || 'NO_CONTRACT';
        const cleanCNo = currentContractNo.replace(/[^a-zA-Z0-9]/g, '_');
        currentProjectID = paramProj || basicData.projectID || `PROJ_${cleanCNo}`;
        currentDriveFolderId = basicData.driveFolderId || '';
      } else {
        currentContractNo = paramContract || 'DEFAULT';
        currentProjectID = paramProj || `PROJ_${currentContractNo.replace(/[^a-zA-Z0-9]/g, '_')}`;
      }

      MAP_STORAGE_KEY = `PROJECT_MAP_IMAGE_DATA_${currentProjectID}`;
      
      const badgeEl = document.getElementById('lbl_badge_contract');
      if (badgeEl) badgeEl.textContent = `สัญญา: ${currentContractNo} (ID: ${currentProjectID})`;
    }

    function deleteMapImage() {
      if (confirm('คุณต้องการลบรูปภาพแผนที่ของโครงการนี้ใช่หรือไม่คะ?')) {
        localStorage.removeItem(MAP_STORAGE_KEY);
        resetMapDisplay();
        alert('ลบรูปภาพแผนที่จากหน้าจอเรียบร้อยแล้วค่ะ');
      }
    }

    function compressImage(img, maxWidth, maxHeight, quality) {
      let width = img.width;
      let height = img.height;

      if (width > height) {
        if (width > maxWidth) {
          height *= maxWidth / width;
          width = maxWidth;
        }
      } else {
        if (height > maxHeight) {
          width *= maxHeight / height;
          height = maxHeight;
        }
      }

      const canvas = document.createElement('canvas');
      canvas.width = Math.round(width);
      canvas.height = Math.round(height);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', quality);
    }

    function processMapUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const btnUpload = document.getElementById('btn_upload_map');
      const originalBtnHtml = btnUpload.innerHTML;
      btnUpload.disabled = true;
      btnUpload.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> กำลังอัปโหลด...`;
      lucide.createIcons();

      const objectUrl = URL.createObjectURL(file);
      displayMapImage(objectUrl);

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = async function() {
          // 1. ภาพขนาดใหญ่สำหรับส่งขึ้น Google Drive (กว้างไม่เกิน 1200px คุณภาพ 0.75)
          const uploadBase64 = compressImage(img, 1200, 1600, 0.75);

          // 2. ภาพขนาดเล็กสำหรับแคชใน LocalStorage ป้องกัน Quota Exceeded (กว้างไม่เกิน 800px คุณภาพ 0.6)
          const previewBase64 = compressImage(img, 800, 1000, 0.6);

          // บันทึกลง LocalStorage ก่อน
          try {
            localStorage.setItem(MAP_STORAGE_KEY, previewBase64);
            displayMapImage(previewBase64);
          } catch (storageErr) {
            console.warn("LocalStorage เต็ม ไม่สามารถบันทึกภาพลงเครื่องได้:", storageErr);
          }

          // 3. ส่งไฟล์ขึ้น Google Drive ผ่าน Apps Script
          try {
            const payload = {
              action: 'upload_original_photo',
              driveFolderId: currentDriveFolderId,
              contractNo: currentContractNo,
              imageB64: uploadBase64,
              fileName: `Map_${currentContractNo.replace(/[/\\?%*:|"<>]/g, '_')}_${Date.now()}.jpg`
            };

            const response = await fetch(GOOGLE_SCRIPT_URL, {
              method: 'POST',
              mode: 'cors',
              redirect: 'follow',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(payload)
            });

            const result = await response.json();
            if (result && result.status === 'success') {
              alert("อัปโหลดรูปภาพแผนที่ไปยัง Google Drive และบันทึกเรียบร้อยแล้วค่ะ!");
            } else {
              throw new Error(result ? result.message : "การตอบกลับไม่ถูกต้อง");
            }
          } catch (cloudErr) {
            console.error("Cloud upload error:", cloudErr);
            alert("บันทึกรูปลงในหน้าจอเรียบร้อยแล้วค่ะ (แต่การส่งขึ้น Google Drive แจ้งเตือน: " + cloudErr.message + ")");
          } finally {
            btnUpload.disabled = false;
            btnUpload.innerHTML = originalBtnHtml;
            lucide.createIcons();
            URL.revokeObjectURL(objectUrl);
          }
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    function displayMapImage(src) {
      const img = document.getElementById('map_image_preview');
      const placeholder = document.getElementById('map_placeholder');
      img.src = src;
      img.classList.remove('hidden');
      placeholder.classList.add('hidden');
    }

    function resetMapDisplay() {
      const img = document.getElementById('map_image_preview');
      const placeholder = document.getElementById('map_placeholder');
      img.src = '';
      img.classList.add('hidden');
      placeholder.classList.remove('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      initProjectContext();

      const urlParams = new URLSearchParams(window.location.search);
      const monthCode = urlParams.get('month');
      if (monthCode) {
        document.getElementById('btn_back_menu').href = `../Monthly_Reference.html?month=${monthCode}`;
      }

      // โหลดข้อมูลโครงการเพื่อแสดงชื่อและหน่วยงาน
      const basicRaw = localStorage.getItem(`LOCAL_BASIC_INFO_${currentProjectID}`) || localStorage.getItem('LOCAL_BASIC_INFO');
      if (basicRaw) {
        try {
          const projectData = JSON.parse(basicRaw);
          if (projectData.projectName) {
            document.getElementById('lbl_project_desc').textContent = projectData.projectName;
          }
          if (projectData.organizationName) {
            document.getElementById('lbl_footer_org').textContent = projectData.organizationName;
          }
        } catch (e) {
          console.error("Error loading project info:", e);
        }
      }

      // ดึงภาพแผนที่ที่เคยบันทึกไว้ของโครงการนี้
      const savedMap = localStorage.getItem(MAP_STORAGE_KEY);
      if (savedMap) {
        displayMapImage(savedMap);
      } else {
        resetMapDisplay();
      }
    });
  </script>
</body>
</html>
