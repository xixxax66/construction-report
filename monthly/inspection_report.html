<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดงวดงานและการตรวจรับงาน - รายงานประจำเดือน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../assets/gas-sync.js"></script>
  <style>
    @font-face { font-family: 'THSarabunPSK'; src: url('../assets/THSarabun.ttf') format('truetype'); font-weight: normal; }
    @font-face { font-family: 'THSarabunPSK'; src: url('../assets/THSarabun Bold.ttf') format('truetype'); font-weight: bold; }
    @page { size: A4 portrait; margin: 0; }
    body { font-family: 'THSarabunPSK', sans-serif; background-color: #94a3b8; margin: 0; padding: 0; }
    
    .sheet-workspace {
      width: 100%;
      max-width: 210mm;
      min-height: 297mm;
      margin: 15px auto;
      background: white;
      padding: 15mm 15mm 15mm 20mm;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      box-sizing: border-box;
      position: relative;
      color: #000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .sheet-top-content {
      width: 100%;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 16pt !important;
      margin-bottom: 10px;
    }

    .table-inspection {
      width: 100%;
      border-collapse: collapse;
      border: 1.5px solid #000;
      margin-top: 5px;
    }

    .table-inspection th, .table-inspection td {
      border: 1px solid #000;
      padding: 6px 8px;
      font-size: 15pt !important;
      vertical-align: middle;
      text-align: center;
      height: 35mm;
    }

    .table-inspection th {
      font-weight: bold;
      height: auto;
      padding: 8px 4px;
    }

    .editable-input {
      background: transparent;
      border: none;
      outline: none;
      width: 100%;
      text-align: center;
      font-family: inherit;
      font-size: inherit;
    }
    .editable-input:focus {
      background-color: #fef08a;
    }

    .note-section {
      margin-top: 25px;
      font-size: 16pt !important;
    }

    .dotted-line {
      border-bottom: 1px dotted #000;
      height: 25px;
      width: 100%;
    }

    @media print {
      body { background: white !important; padding: 0 !important; }
      .no-print { display: none !important; }
      .sheet-workspace { box-shadow: none !important; margin: 0 !important; width: 210mm !important; height: 297mm !important; padding: 15mm 15mm 15mm 20mm !important; }
      .editable-input { background: transparent !important; }
    }
  </style>
</head>
<body class="p-2 sm:p-4 min-h-screen flex flex-col items-center">

  <!-- แผงควบคุมด้านบน (ไม่พิมพ์ออกกระดาษ) -->
  <div class="max-w-[210mm] w-full mb-4 bg-white p-5 rounded-2xl shadow-lg border border-slate-300 flex flex-wrap items-center justify-between gap-4 no-print">
    <div class="flex items-center gap-3">
      <!-- 💡 เพิ่ม ID btn_back_menu เพื่อให้จดจำพารามิเตอร์ของเดือน -->
      <a id="btn_back_menu" href="../Monthly_Reference.html" class="p-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-700 flex items-center gap-2 text-2xl font-bold border border-slate-300 shadow-sm">
        <i data-lucide="arrow-left" class="w-6 h-6"></i> กลับเมนู
      </a>
      <span class="font-bold text-slate-800 text-2xl">รายละเอียดงวดงานและการตรวจรับงาน</span>
    </div>
    <div class="flex items-center gap-3 flex-wrap">
      <button onclick="loadInspectionData()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-2xl font-bold flex items-center gap-2 shadow cursor-pointer">
        <i data-lucide="refresh-cw" class="w-6 h-6"></i> ปรับปรุงข้อมูล
      </button>
      <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-2xl font-bold flex items-center gap-2 shadow cursor-pointer">
        <i data-lucide="printer" class="w-6 h-6"></i> พิมพ์ / PDF
      </button>
    </div>
  </div>

  <!-- แผ่นกระดาษ A4 Workspace -->
  <div class="sheet-workspace" id="doc-print">
    <div class="sheet-top-content">
      <div class="header-row">
        <span class="font-bold">๓ รายละเอียดงวดงานและการตรวจรับงาน</span>
        <span id="lbl_org_name">องค์การบริหารส่วนตำบลโพนงาม</span>
      </div>

      <!-- ตารางรายละเอียดงวดงาน -->
      <table class="table-inspection">
        <thead>
          <tr>
            <th class="w-20">งาน<br>งวดที่</th>
            <th class="w-36">จำนวนเงิน<br>(บาท)</th>
            <th class="w-40">วัน เดือน ปี<br>ที่แล้วเสร็จ</th>
            <th class="w-40">วัน เดือน ปี<br>ที่ตรวจรับ</th>
            <th>หมายเหตุ</th>
          </tr>
        </thead>
        <tbody id="inspection_table_body">
          <!-- เติมแถวตามจำนวนงวดงาน -->
        </tbody>
      </table>

      <!-- ส่วนหมายเหตุ -->
      <div class="note-section">
        <p class="font-bold mb-1">หมายเหตุ</p>
        <div class="dotted-line"></div>
        <div class="dotted-line"></div>
        <div class="dotted-line"></div>
        <div class="dotted-line"></div>
      </div>
    </div>

    <!-- ส่วนท้ายกระดาษ -->
    <div></div>
  </div>

  <script>
    lucide.createIcons();
    
    // 💡 เตรียมตัวแปรสำหรับผูกคีย์ข้อมูลกับรหัสโครงการ
    let currentProjectID = 'DEFAULT_PROJ';

    function initProjectContext() {
      const basicRaw = localStorage.getItem('LOCAL_BASIC_INFO');
      if (basicRaw) {
        try {
          const projectData = JSON.parse(basicRaw);
          const cNo = projectData.contractNo || 'NO_CONTRACT';
          currentProjectID = `PROJ_${cNo.replace(/[^a-zA-Z0-9]/g, '_')}`;
        } catch(e) {}
      }
    }

    function getStorageKey() {
      return `MONTHLY_INSPECTION_DATES_DB_${currentProjectID}`;
    }

    function toThaiNumber(numStr) {
      if (numStr === null || numStr === undefined) return '';
      const thaiNums = ['๐', '๑', '๒', '๓', '๔', '๕', '๖', '๗', '๘', '๙'];
      return numStr.toString().replace(/[0-9]/g, (w) => thaiNums[w]);
    }

    function formatThaiCurrency(amountStr) {
      if (!amountStr) return '๐.๐๐';
      const clean = amountStr.toString().replace(/,/g, '').replace(/[๐-๙]/g, (s) => "๐๑๒๓๔๕๖๗๘๙".indexOf(s));
      const num = parseFloat(clean);
      if (isNaN(num)) return toThaiNumber(amountStr);
      const parts = num.toFixed(2).split('.');
      const integerPart = parseInt(parts[0]).toLocaleString('en-US');
      return toThaiNumber(`${integerPart}.${parts[1]}`);
    }

    function toThaiDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const year = parseInt(parts[0]) + 543;
      const monthNames = [
        "", "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", 
        "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", 
        "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
      ];
      const month = monthNames[parseInt(parts[1])];
      const day = parseInt(parts[2]);
      
      return `${toThaiNumber(day)} ${month} ${toThaiNumber(year)}`;
    }

    function onDateSelected(idx, type, val) {
      if (!val) return;
      const formattedDate = toThaiDate(val);
      if (type === 'end') {
        document.getElementById(`end_date_${idx}`).value = formattedDate;
        saveInspectionData(idx);
      } else if (type === 'accept') {
        document.getElementById(`accept_date_${idx}`).value = formattedDate;
        saveInspectionData(idx);
      }
    }

    function loadInspectionData() {
      initProjectContext();
      try {
        let installments = [];
        let orgName = "องค์การบริหารส่วนตำบลโพนงาม";

        // 1. โหลดข้อมูลจาก LOCAL_BASIC_INFO ตามโปรเจกต์
        const basicRaw = localStorage.getItem(`LOCAL_BASIC_INFO_${currentProjectID}`) || localStorage.getItem('LOCAL_BASIC_INFO');
        if (basicRaw) {
          const data = JSON.parse(basicRaw);
          if (data.organizationName) {
            orgName = data.organizationName;
          }
          if (data.installments && Array.isArray(data.installments) && data.installments.length > 0) {
            installments = data.installments;
          }
        }

        document.getElementById('lbl_org_name').textContent = toThaiNumber(orgName);

        // 2. โหลดข้อมูลวันที่ที่เคยบันทึกไว้ ของโครงการนี้
        let savedDates = {};
        const savedDatesRaw = localStorage.getItem(getStorageKey()) || localStorage.getItem('MONTHLY_INSPECTION_DATES_DB');
        if (savedDatesRaw) {
          try { savedDates = JSON.parse(savedDatesRaw); } catch(e){}
        }

        const tbody = document.getElementById('inspection_table_body');
        if (!tbody) return;
        tbody.innerHTML = '';

        if (installments.length === 0) {
          installments = [{ amount: "2,849,260.00" }];
        }

        installments.forEach((inst, idx) => {
          const periodTh = toThaiNumber(idx + 1);
          const amountTh = formatThaiCurrency(inst.amount || '0.00');
          const endDateVal = savedDates[`end_${idx}`] !== undefined ? savedDates[`end_${idx}`] : '-';
          const acceptDateVal = savedDates[`accept_${idx}`] !== undefined ? savedDates[`accept_${idx}`] : '-';
          const noteVal = savedDates[`note_${idx}`] !== undefined ? savedDates[`note_${idx}`] : '-';

          tbody.innerHTML += `
            <tr>
              <td class="font-bold">${periodTh}</td>
              <td class="text-right pr-3">${amountTh}</td>
              <td>
                <div class="flex items-center justify-center gap-1">
                  <input type="text" class="editable-input text-center" value="${endDateVal}" onchange="saveInspectionData(${idx})" id="end_date_${idx}">
                  <input type="date" class="no-print cursor-pointer text-xs p-0.5 rounded border border-slate-300 bg-slate-50" onchange="onDateSelected(${idx}, 'end', this.value)" title="เลือกจากปฏิทิน">
                </div>
              </td>
              <td>
                <div class="flex items-center justify-center gap-1">
                  <input type="text" class="editable-input text-center" value="${acceptDateVal}" onchange="saveInspectionData(${idx})" id="accept_date_${idx}">
                  <input type="date" class="no-print cursor-pointer text-xs p-0.5 rounded border border-slate-300 bg-slate-50" onchange="onDateSelected(${idx}, 'accept', this.value)" title="เลือกจากปฏิทิน">
                </div>
              </td>
              <td><input type="text" class="editable-input text-center" value="${noteVal}" onchange="saveInspectionData(${idx})" id="note_${idx}"></td>
            </tr>
          `;
        });
      } catch (err) {
        console.error("Error loading inspection data:", err);
      }
    }

    function saveInspectionData(idx) {
      let savedDates = {};
      const savedDatesRaw = localStorage.getItem(getStorageKey());
      if (savedDatesRaw) {
        try { savedDates = JSON.parse(savedDatesRaw); } catch(e){}
      }

      savedDates[`end_${idx}`] = document.getElementById(`end_date_${idx}`).value;
      savedDates[`accept_${idx}`] = document.getElementById(`accept_date_${idx}`).value;
      savedDates[`note_${idx}`] = document.getElementById(`note_${idx}`).value;

      localStorage.setItem(getStorageKey(), JSON.stringify(savedDates));
      localStorage.setItem('MONTHLY_INSPECTION_DATES_DB', JSON.stringify(savedDates)); // แบ็คอัพลงคีย์เก่าด้วย
    }

    window.addEventListener('DOMContentLoaded', () => {
      // 💡 จดจำพารามิเตอร์ URL เพื่อกลับไปเมนูเดือนเดิม
      const urlParams = new URLSearchParams(window.location.search);
      const monthCode = urlParams.get('month');
      if (monthCode) {
        document.getElementById('btn_back_menu').href = `../Monthly_Reference.html?month=${monthCode}`;
      }
      
      loadInspectionData();
    });
  </script>
</body>
</html>
