<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ผลงานการดำเนินงานประจำเดือน - รายงานประจำเดือน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../assets/gas-sync.js"></script>
  <style>
    @font-face { font-family: 'THSarabunPSK'; src: url('../assets/THSarabun.ttf') format('truetype'); font-weight: normal; }
    @font-face { font-family: 'THSarabunPSK'; src: url('../assets/THSarabun Bold.ttf') format('truetype'); font-weight: bold; }
    @page { size: A4 portrait; margin: 0; }
    body { font-family: 'THSarabunPSK', sans-serif; background-color: #94a3b8; margin: 0; padding: 0; }
    
    .sheet-workspace {
      width: 100%;
      max-width: 210mm;
      min-height: 297mm;
      margin: 15px auto;
      background: white;
      padding: 15mm 15mm 15mm 20mm;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      box-sizing: border-box;
      position: relative;
      color: #000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .sheet-top-content {
      width: 100%;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 16pt !important;
      margin-bottom: 10px;
    }

    .table-progress {
      width: 100%;
      border-collapse: collapse;
      border: 1.5px solid #000;
      margin-top: 5px;
    }

    .table-progress th, .table-progress td {
      border: 1px solid #000;
      padding: 4px 6px;
      font-size: 15pt !important;
      vertical-align: middle;
    }

    .table-progress th {
      text-align: center;
      font-weight: bold;
      background-color: #f8fafc;
    }

    @media print {
      body { background: white !important; padding: 0 !important; }
      .no-print { display: none !important; }
      .sheet-workspace { box-shadow: none !important; margin: 0 !important; width: 210mm !important; height: 297mm !important; padding: 15mm 15mm 15mm 20mm !important; }
    }
  </style>
</head>
<body class="p-2 sm:p-4 min-h-screen flex flex-col items-center">

  <!-- แผงควบคุมด้านบน (ไม่พิมพ์ออกกระดาษ) -->
  <div class="max-w-[210mm] w-full mb-4 bg-white p-5 rounded-2xl shadow-lg border border-slate-300 flex flex-wrap items-center justify-between gap-4 no-print">
    <div class="flex items-center gap-3">
      <a href="../Monthly_Reference.html" class="p-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-700 flex items-center gap-2 text-xl font-bold border border-slate-300 shadow-sm">
        <i data-lucide="arrow-left" class="w-6 h-6"></i> กลับเมนู
      </a>
      <span class="font-bold text-slate-800 text-2xl">ผลงานการดำเนินงานประจำเดือน</span>
    </div>
    <div class="flex items-center gap-3 flex-wrap">
      <button onclick="loadProgressData()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-xl font-bold flex items-center gap-2 shadow">
        <i data-lucide="refresh-cw" class="w-6 h-6"></i> ปรับปรุงข้อมูล
      </button>
      <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-xl font-bold flex items-center gap-2 shadow">
        <i data-lucide="printer" class="w-6 h-6"></i> พิมพ์ / PDF
      </button>
    </div>
  </div>

  <!-- แผ่นกระดาษ A4 Workspace -->
  <div class="sheet-workspace" id="doc-print">
    <div class="sheet-top-content">
      <div class="header-row">
        <span class="font-bold">๒ ผลงานการดำเนินงานประจำเดือน</span>
        <span id="lbl_org_name">องค์การบริหารส่วนตำบลโพนงาม</span>
      </div>

      <!-- ตารางผลงานการดำเนินงาน -->
      <table class="table-progress">
        <thead>
          <tr>
            <th rowspan="2" class="w-12">ที่</th>
            <th rowspan="2">งานที่ดำเนินการ</th>
            <th rowspan="2" class="w-24">สัดส่วนของ<br>งาน (%)</th>
            <th colspan="3">ผลงาน %</th>
            <th rowspan="2" class="w-24">ผลงานรวม<br>%</th>
          </tr>
          <tr>
            <th class="w-20">ถึงเดือนก่อน</th>
            <th class="w-20">ในเดือน</th>
            <th class="w-20">สะสม</th>
          </tr>
        </thead>
        <tbody id="progress_table_body">
          <!-- ข้อมูลถูกเติมผ่าน Script -->
        </tbody>
        <tfoot>
          <tr>
            <td colspan="2" class="text-center font-bold bg-slate-50">รวม</td>
            <td class="text-center font-bold bg-slate-50" id="total_weight_sum">๑๐๐.๐๐</td>
            <td class="text-center font-bold bg-slate-50" id="total_prev_sum">-</td>
            <td class="text-center font-bold bg-slate-50" id="total_month_sum">-</td>
            <td class="text-center font-bold bg-slate-50" id="total_accumulated_sum">-</td>
            <td class="text-center font-bold bg-slate-50" id="total_result_sum">-</td>
          </tr>
        </tfoot>
      </table>
    </div>

    <!-- ส่วนท้ายกระดาษ -->
    <div></div>
  </div>

  <script>
    lucide.createIcons();

    let currentProjectID = 'DEFAULT_PROJ';

    function initProjectContext() {
      const basicRaw = localStorage.getItem('LOCAL_BASIC_INFO');
      if (basicRaw) {
        try {
          const projectData = JSON.parse(basicRaw);
          const cNo = projectData.contractNo || 'NO_CONTRACT';
          currentProjectID = `PROJ_${cNo.replace(/[^a-zA-Z0-9]/g, '_')}`;
        } catch(e) {}
      }
    }

    function toThaiNumber(numStr) {
      if (numStr === null || numStr === undefined || isNaN(numStr)) return '-';
      const num = parseFloat(numStr);
      if (num === 0) return '-';
      const formatted = num.toFixed(2);
      const thaiNums = ['๐', '๑', '๒', '๓', '๔', '๕', '๖', '๗', '๘', '๙'];
      return formatted.replace(/[0-9]/g, (w) => thaiNums[w]);
    }

    function loadProgressData() {
      initProjectContext();
      try {
        // 1. โหลดชื่อหน่วยงาน
        let orgName = "องค์การบริหารส่วนตำบลโพนงาม";
        const basicRaw = localStorage.getItem(`LOCAL_BASIC_INFO_${currentProjectID}`) || localStorage.getItem('LOCAL_BASIC_INFO');
        if (basicRaw) {
          const data = JSON.parse(basicRaw);
          if (data.organizationName) orgName = data.organizationName;
        }
        document.getElementById('lbl_org_name').textContent = orgName;

        // 2. ตรวจสอบสัปดาห์ที่ถูกเลือกล่าสุดของโครงการนี้ จากหน้ารายงานประจำเดือน
        let targetWeek = 5; 
        const monthlyRaw = localStorage.getItem(`MONTHLY_REPORT_INFO_DATA_${currentProjectID}`) || localStorage.getItem('MONTHLY_REPORT_INFO_DATA');
        if (monthlyRaw) {
          const mData = JSON.parse(monthlyRaw);
          if (mData.planWeek !== undefined && mData.planWeek !== '') {
            targetWeek = parseInt(mData.planWeek) || 5;
          }
        }

        // 3. โหลดข้อมูลผลงานรายสัปดาห์ ตาม targetWeek
        let weekDataObj = null;
        const progressRaw = localStorage.getItem(`WEEK_PROGRESS_DATA_${currentProjectID}_${targetWeek}`) || localStorage.getItem(`WEEK_PROGRESS_DATA_${targetWeek}`);
        if (progressRaw) {
          weekDataObj = JSON.parse(progressRaw);
        } else {
          // หากไม่มี ลองถอยหาสัปดาห์ก่อนหน้าที่มีการบันทึก
          for (let w = targetWeek; w >= 1; w--) {
            const wRaw = localStorage.getItem(`WEEK_PROGRESS_DATA_${currentProjectID}_${w}`) || localStorage.getItem(`WEEK_PROGRESS_DATA_${w}`);
            if (wRaw) {
              weekDataObj = JSON.parse(wRaw);
              break;
            }
          }
        }

        // 4. โหลดผลงานสะสมของเดือนก่อนหน้า (เพื่อเอามาใส่ช่อง "ถึงเดือนก่อน")
        // *สมมติฐาน: ในการทำงานจริงจะต้องมีกลไกบันทึกว่าเดือนก่อนได้เท่าไหร่ 
        // เบื้องต้นในระบบนี้จะใช้ค่า prev จาก tasks ของสัปดาห์ที่ 1 หรือถ้าให้ง่ายสุด ตอนนี้แสดงผลเฉพาะในเดือนและสะสมให้ตรงกับสัปดาห์ล่าสุด
        
        const tbody = document.getElementById('progress_table_body');
        if (!tbody) return;
        tbody.innerHTML = '';

        if (!weekDataObj || !weekDataObj.tasks || weekDataObj.tasks.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center text-rose-500 py-4">ไม่พบข้อมูลการบันทึกผลงานในสัปดาห์ที่ ${targetWeek} ของโครงการนี้ กรุณาบันทึกข้อมูลในหน้ารายสัปดาห์ก่อนค่ะ</td></tr>`;
          return;
        }

        let sumProportion = 0;
        let sumPrev = 0;
        let sumMonth = 0;
        let sumAccum = 0;
        let sumTotalResult = 0;

        weekDataObj.tasks.forEach((task, idx) => {
          const prop = parseFloat(task.proportion) || 0;
          const prev = parseFloat(task.prev) || 0;
          const curr = parseFloat(task.curr) || 0;
          const accum = prev + curr;

          // คำนวณผลงานรวม
          const resultPrev = prop * (prev / 100);
          const resultCurr = prop * (curr / 100);
          const resultAccum = prop * (accum / 100);

          sumProportion += prop;
          sumPrev += resultPrev;
          sumMonth += resultCurr;
          sumAccum += resultAccum;
          sumTotalResult += resultAccum;

          const idxTh = toThaiNumber(idx + 1).replace('.๐๐', '');
          const propTh = prop > 0 ? toThaiNumber(prop) : '-';
          const prevTh = prev > 0 ? toThaiNumber(prev) : '-';
          const currTh = curr > 0 ? toThaiNumber(curr) : '-';
          const accumTh = accum > 0 ? toThaiNumber(accum) : '-';
          const resAccumTh = resultAccum > 0 ? toThaiNumber(resultAccum) : '-';

          tbody.innerHTML += `
            <tr>
              <td class="text-center">${idxTh}</td>
              <td class="pl-2">${task.name || 'ไม่มีชื่อรายการ'}</td>
              <td class="text-center">${propTh}</td>
              <td class="text-center">${prevTh}</td>
              <td class="text-center">${currTh}</td>
              <td class="text-center font-bold">${accumTh}</td>
              <td class="text-center font-bold text-emerald-800">${resAccumTh}</td>
            </tr>
          `;
        });

        document.getElementById('total_weight_sum').textContent = sumProportion > 0 ? toThaiNumber(sumProportion) : '๑๐๐.๐๐';
        document.getElementById('total_prev_sum').textContent = sumPrev > 0 ? toThaiNumber(sumPrev) : '-';
        document.getElementById('total_month_sum').textContent = sumMonth > 0 ? toThaiNumber(sumMonth) : '-';
        document.getElementById('total_accumulated_sum').textContent = sumAccum > 0 ? toThaiNumber(sumAccum) : '-'; // ปกติผลรวมของเปอร์เซ็นต์รวมจะไม่ถูกรวมแบบตรงๆ แต่จะใช้ totalResult แทน
        document.getElementById('total_result_sum').textContent = sumTotalResult > 0 ? toThaiNumber(sumTotalResult) : '-';

      } catch (err) {
        console.error("Error loading progress data:", err);
      }
    }

    window.addEventListener('DOMContentLoaded', loadProgressData);
  </script>
</body>
</html>
